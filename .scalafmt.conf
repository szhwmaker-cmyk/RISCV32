version = "3.7.14"
runner.dialect = scala213

maxColumn = 100
indent.main = 2
indent.significant = 2
indent.callSite = 2
indent.ctorSite = 2
indent.defnSite = 2

align.preset = more
align.multiline = false

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]

continuationIndent.defnSite = 2
continuationIndent.extendSite = 2

newlines.source = keep
